<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traçabilité Production</title>
    <style>
        /* DESIGN ET ERGONOMIE */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --primary: #3498db;
            --secondary: #2c3e50;
            --roto-color: #9b59b6;
            --chariot-color: #e67e22;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark-blue: #34495e;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 18px;
        }

        h1, h2 {
            text-align: center;
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-now { background-color: var(--primary); margin-top: 10px; width: 100%; }
        .btn-today { background-color: #27ae60; margin-top: 10px; width: 100%; }
        .btn-roto { background-color: var(--roto-color); width: 48%; }
        .btn-chariot { background-color: var(--chariot-color); width: 48%; }
        .btn-delete { background-color: var(--danger); padding: 15px; font-size: 1rem; }
        .btn-export { background-color: var(--success); width: 100%; font-size: 1.5rem; padding: 20px; margin-top: 15px; }
        .btn-fin-prod { background-color: #f39c12; width: 100%; font-size: 1.5rem; padding: 20px; margin-top: 30px; }
        
        .buttons-menu {
            grid-column: span 2;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .btn-section { background-color: var(--dark-blue); flex: 1; min-width: 180px; }

        .header-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
        }

        .section-deroulante {
            grid-column: span 2;
            background: #e8eaed;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--dark-blue);
            display: none; 
            margin-top: -10px;
            margin-bottom: 10px;
        }
        
        .checkbox-grid, .lots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-large {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #bdc3c7;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-large input {
            width: 25px;
            height: 25px;
            margin-right: 15px;
            cursor: pointer;
        }

        .tolerance-display {
            font-weight: bold;
            color: var(--danger);
            font-size: 1.2rem;
            grid-column: span 2;
            text-align: center;
            padding: 10px;
            background: #fdf2e9;
            border-radius: 8px;
        }

        .actions-echelles {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .echelle-card {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr 1fr 1.5fr auto;
            gap: 15px;
            align-items: center;
            background: #fff;
            border: 2px solid #bdc3c7;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }

        .echelle-type { font-weight: bold; font-size: 1.3rem; text-align: center; }
        .type-roto { color: var(--roto-color); }
        .type-chariot { color: var(--chariot-color); }

        /* FENÊTRES MODALES (Pop-ups) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; color: var(--secondary); text-align: center; }
        
        .liste-pieces {
            background: #f8f9fa;
            padding: 15px 30px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            background: #ecf0f1;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            border: 2px solid transparent;
        }

        .radio-group input[type="radio"] { width: 25px; height: 25px; margin-right: 10px; }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        @media (max-width: 900px) {
            .echelle-card { grid-template-columns: 1fr 1fr; }
            .echelle-type { grid-column: span 2; }
            .header-grid { grid-template-columns: 1fr; }
            .buttons-menu, .tolerance-display, .section-deroulante { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Consultation & Traçabilité</h1>

    <div class="header-grid">
        <div class="form-group">
            <label for="nom-produit">Nom du Produit :</label>
            <input type="text" id="nom-produit" placeholder="Ex: Baguette..." oninput="this.value = this.value.toUpperCase();">
        </div>

        <div class="form-group">
            <label for="poids-theorique">Poids Théorique Cible (g) :</label>
            <input type="number" id="poids-theorique" placeholder="Saisir pour calculer la marge" oninput="calculerTolerance()">
        </div>

        <div id="affichage-tolerance" class="tolerance-display" style="display:none;">
            Marge tolérée : <span id="marge-texte">-</span>
        </div>

        <div class="buttons-menu">
            <button class="btn-section" onclick="toggleSection('zone-pompes')">⚙️ Sélection Pompes</button>
            <button class="btn-section" onclick="toggleSection('zone-qualite')">🛡️ Contrôles Qualité</button>
            <button class="btn-section" onclick="toggleSection('zone-lots')">📦 Numéros de Lots</button>
            <button class="btn-section" onclick="toggleSection('zone-observations')">📝 Observations</button>
        </div>

        <div id="zone-pompes" class="section-deroulante">
            <label>Pompes utilisées :</label>
            <div class="checkbox-grid">
                <label class="checkbox-large"><input type="checkbox" value="AR1" class="cb-pompe"> AR1</label>
                <label class="checkbox-large"><input type="checkbox" value="AR2" class="cb-pompe"> AR2</label>
                <label class="checkbox-large"><input type="checkbox" value="SJ1" class="cb-pompe"> SJ1</label>
                <label class="checkbox-large"><input type="checkbox" value="SJ2" class="cb-pompe"> SJ2</label>
                <label class="checkbox-large"><input type="checkbox" value="Bodin" class="cb-pompe"> Bodin</label>
            </div>
        </div>

        <div id="zone-qualite" class="section-deroulante">
            <label>Contrôles Qualité Validés :</label>
            <div class="checkbox-grid">
                <label class="checkbox-large"><input type="checkbox" value="Controle poids" class="cb-qualite"> Contrôle poids</label>
                <label class="checkbox-large"><input type="checkbox" value="Respect BHP" class="cb-qualite"> Respect BHP</label>
                <label class="checkbox-large"><input type="checkbox" value="Visa Qualite" class="cb-qualite"> Visa Qualité</label>
                <label class="checkbox-large"><input type="checkbox" value="Tracabilite correcte" class="cb-qualite"> Traçabilité correcte</label>
            </div>
        </div>

        <div id="zone-lots" class="section-deroulante">
            <label>Suivi des Lots :</label>
            <div class="lots-grid">
                <div><label>Lot Moule</label><input type="text" id="lot-moule" oninput="this.value = this.value.toUpperCase();"></div>
                <div><label>Lot Pâte</label><input type="text" id="lot-pate" oninput="this.value = this.value.toUpperCase();"></div>
                <div><label>Lot Appareil</label><input type="text" id="lot-appareil" oninput="this.value = this.value.toUpperCase();"></div>
                <div><label>Lot Fruit</label><input type="text" id="lot-fruit" oninput="this.value = this.value.toUpperCase();"></div>
            </div>
        </div>

        <div id="zone-observations" class="section-deroulante">
            <label>Observations :</label>
            <textarea id="observations-texte" rows="4" placeholder="Saisir vos remarques ici (incidents, ajustements, etc.)..."></textarea>
        </div>

        <div class="form-group">
            <label for="date-jour">Date :</label>
            <input type="date" id="date-jour">
            <button class="btn-today" onclick="setDateAujourdhui('date-jour')">📅 Aujourd'hui</button>
        </div>

        <div class="form-group">
            <label for="heure-debut">Heure de début :</label>
            <input type="time" id="heure-debut">
            <button class="btn-now" onclick="setHeureMaintenant('heure-debut')">🕒 Maintenant</button>
        </div>
    </div>

    <hr style="border:1px solid #bdc3c7; margin: 30px 0;">
    <h2>Saisie des Échelles</h2>
    
    <div class="actions-echelles">
        <button class="btn-roto" onclick="ajouterEchelle('ROTO')">➕ Ajouter une Échelle Roto</button>
        <button class="btn-chariot" onclick="ajouterEchelle('CHARIOT')">➕ Ajouter une Échelle Chariot</button>
    </div>

    <div id="conteneur-echelles"></div>

    <button class="btn-fin-prod" onclick="ouvrirModalChoixLigne()">🏁 Fin de production (Contrôle Matériel)</button>
    <button class="btn-export" onclick="exporterCSV()">💾 Valider et Exporter la Feuille (CSV)</button>

</div>

<div id="modal-choix-ligne" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">Sélection de la ligne de production</div>
        <div class="form-group">
            <select id="select-ligne" size="5" style="height: auto;">
                <option value="Fillpack">Fillpack</option>
                <option value="Doseuse 14 pistes">Doseuse 14 pistes</option>
                <option value="Ligne Basque (Saint-Julien)">Ligne Basque (Saint-Julien)</option>
                <option value="Ligne Tartelette (Argentat)">Ligne Tartelette (Argentat)</option>
                <option value="Nouvelle ligne 7">Nouvelle ligne 7</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button style="background:var(--danger); flex:1;" onclick="fermerModals()">Annuler</button>
            <button style="background:var(--primary); flex:2;" onclick="validerChoixLigne()">Suivant ➡️</button>
        </div>
    </div>
</div>

<div id="modal-controle-ligne" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header" id="titre-controle-ligne">Contrôle Fin de Production</div>
        
        <label>Pièces à vérifier obligatoirement :</label>
        <ul id="liste-pieces-machine" class="liste-pieces">
            </ul>

        <label style="text-align: center; margin-top: 20px;">Intégrité de l'ensemble du matériel vérifiée et conforme ?</label>
        <div class="radio-group">
            <label><input type="radio" name="radio-conforme" value="OUI"> OUI</label>
            <label><input type="radio" name="radio-conforme" value="NON"> NON</label>
        </div>

        <div class="form-group">
            <label>Visa Opérateur :</label>
            <input type="text" id="visa-fin-prod" placeholder="Initiales" oninput="this.value = this.value.toUpperCase();">
        </div>

        <div class="modal-buttons">
            <button style="background:var(--danger); flex:1;" onclick="retourChoixLigne()">⬅️ Retour</button>
            <button style="background:var(--success); flex:2;" onclick="sauvegarderFinProd()">✅ Valider le contrôle</button>
        </div>
    </div>
</div>

<script>
    let poidsCible = 0;
    let toleranceActuelle = 0;
    
    // Stockage des données de fin de production
    let dataFinProd = {
        ligne: "Non réalisée",
        conforme: "N/A",
        visa: ""
    };

    // Base de données des pièces par machine
    const equipementsMachines = {
        "Fillpack": [
            "Vis ressort clapet (*5)"
        ],
        "Doseuse 14 pistes": [
            "Cône de doseuse (*1)",
            "Joint de la carotte (*1)",
            "Cônes doseuse (*14)",
            "Vis fixation carter doseuse (*28)"
        ],
        "Ligne Basque (Saint-Julien)": [
            "Plexiglas (*1)",
            "Clavette matrices (*8)",
            "Vis extrudeur (*2)",
            "Vis (*6)",
            "Rondelles du sabot (*6)",
            "Miroir (*1)",
            "Goupilles tiges fixation lame paton (*2)",
            "Morceaux de tapis effilochés"
        ],
        "Ligne Tartelette (Argentat)": [
            "Fonceuse : Goupilles matrices (x24)",
            "Fonceuse : Goupilles tiges fixation guillotine (x2)",
            "Fonceuse : Goupilles tiges fixation lame paton (x2)",
            "Machine crumble : Vis fixation buse (x2)",
            "Machine crumble : Vis aimant trémis (x4)"
        ],
        "Nouvelle ligne 7": [
            "Visserie mano capteur (voir photo)"
        ]
    };

    window.onload = function() { setDateAujourdhui('date-jour'); };

    function setDateAujourdhui(id) {
        document.getElementById(id).valueAsDate = new Date();
    }

    function setHeureMaintenant(elementId) {
        const maintenant = new Date();
        document.getElementById(elementId).value = `${String(maintenant.getHours()).padStart(2, '0')}:${String(maintenant.getMinutes()).padStart(2, '0')}`;
    }

    function toggleSection(id) {
        const section = document.getElementById(id);
        const etat = window.getComputedStyle(section).display;
        document.querySelectorAll('.section-deroulante').forEach(s => s.style.display = 'none');
        if (etat === "none") section.style.display = "block";
    }

    function calculerTolerance() {
        const inputValeur = document.getElementById("poids-theorique").value;
        const affichageDiv = document.getElementById("affichage-tolerance");
        if (inputValeur && !isNaN(inputValeur)) {
            poidsCible = parseFloat(inputValeur);
            toleranceActuelle = poidsCible < 200 ? 3 : 10;
            affichageDiv.style.display = "block";
            document.getElementById("marge-texte").innerText = `+/- ${toleranceActuelle} g (De ${poidsCible - toleranceActuelle}g à ${poidsCible + toleranceActuelle}g)`;
        } else {
            affichageDiv.style.display = "none";
            poidsCible = 0; toleranceActuelle = 0;
        }
    }

    function ajouterEchelle(type) {
        const conteneur = document.getElementById("conteneur-echelles");
        const identifiant = Date.now();
        const div = document.createElement("div");
        div.className = `echelle-card classe-${type}`;
        div.id = `echelle-${identifiant}`;
        const typeClass = type === 'ROTO' ? 'type-roto' : 'type-chariot';

        div.innerHTML = `
            <div class="echelle-type ${typeClass}"></div>
            <div><label>Poids réel (g)</label><input type="number" class="input-poids"></div>
            <div><label>Visa</label><input type="text" class="input-visa" oninput="this.value = this.value.toUpperCase()"></div>
            <div><label>Nb Grilles</label><input type="number" class="input-grilles"></div>
            <div><label>Heure fin</label><input type="time" class="input-heure" id="heure-${identifiant}"><button class="btn-now" style="padding: 10px;" onclick="setHeureMaintenant('heure-${identifiant}')">🕒</button></div>
            <div><label>&nbsp;</label><button class="btn-delete" onclick="supprimerEchelle('echelle-${identifiant}', '${type}')">🗑️</button></div>
        `;
        conteneur.appendChild(div);
        renumeroterEchelles(type);
    }

    function supprimerEchelle(id, type) {
        document.getElementById(id).remove();
        renumeroterEchelles(type);
    }

    function renumeroterEchelles(type) {
        document.querySelectorAll(`.echelle-card.classe-${type}`).forEach((carte, index) => {
            const num = index + 1;
            const cible = carte.querySelector(".echelle-type");
            cible.innerText = `${type} ${num}`;
            cible.setAttribute("data-nom-reel", `${type} ${num}`);
        });
    }

    /* GESTION DES MODALS FIN DE PRODUCTION */
    function ouvrirModalChoixLigne() {
        document.getElementById("modal-choix-ligne").style.display = "flex";
    }

    function fermerModals() {
        document.getElementById("modal-choix-ligne").style.display = "none";
        document.getElementById("modal-controle-ligne").style.display = "none";
    }

    function validerChoixLigne() {
        const ligneSelect = document.getElementById("select-ligne").value;
        if (!ligneSelect) { alert("Veuillez sélectionner une machine."); return; }
        
        document.getElementById("modal-choix-ligne").style.display = "none";
        document.getElementById("titre-controle-ligne").innerText = `Contrôle : ${ligneSelect}`;
        
        const ulPieces = document.getElementById("liste-pieces-machine");
        ulPieces.innerHTML = "";
        equipementsMachines[ligneSelect].forEach(piece => {
            let li = document.createElement("li");
            li.style.marginBottom = "8px";
            li.innerText = piece;
            ulPieces.appendChild(li);
        });

        const radios = document.getElementsByName("radio-conforme");
        radios.forEach(r => r.checked = false);
        document.getElementById("visa-fin-prod").value = "";

        document.getElementById("modal-controle-ligne").style.display = "flex";
    }

    function retourChoixLigne() {
        document.getElementById("modal-controle-ligne").style.display = "none";
        document.getElementById("modal-choix-ligne").style.display = "flex";
    }

    function sauvegarderFinProd() {
        const ligneSelect = document.getElementById("select-ligne").value;
        const conformeChecked = document.querySelector('input[name="radio-conforme"]:checked');
        const visa = document.getElementById("visa-fin-prod").value;

        if (!conformeChecked || !visa) {
            alert("Veuillez cocher OUI ou NON et apposer votre Visa.");
            return;
        }

        dataFinProd.ligne = ligneSelect;
        dataFinProd.conforme = conformeChecked.value;
        dataFinProd.visa = visa;

        alert(`Contrôle de fin de production pour la ligne ${ligneSelect} enregistré avec succès.`);
        fermerModals();
    }

    /* EXPORT CSV */
    function exporterCSV() {
        const nomProduit = document.getElementById("nom-produit").value;
        if (!nomProduit) { alert("Veuillez saisir un nom de produit."); return; }

        let pompesChoisies = [];
        document.querySelectorAll('.cb-pompe:checked').forEach(cb => pompesChoisies.push(cb.value));
        
        let qualitesChoisies = [];
        document.querySelectorAll('.cb-qualite:checked').forEach(cb => qualitesChoisies.push(cb.value));
        
        // Récupération des observations (nettoyage des sauts de ligne et points-virgules pour le CSV)
        let observationsText = document.getElementById("observations-texte").value;
        observationsText = observationsText.replace(/(\r\n|\n|\r)/gm, " - ").replace(/;/g, ",");
        
        let csvLines = [
            "=== FEUILLE DE TRACABILITE ===",
            `Date;${document.getElementById("date-jour").value}`,
            `Heure de debut;${document.getElementById("heure-debut").value}`,
            `Nom Produit;${nomProduit}`,
            `Poids Theorique (g);${document.getElementById("poids-theorique").value || "N/A"}`,
            `Pompes utilisees;${pompesChoisies.length ? pompesChoisies.join(", ") : "Aucune"}`,
            `Controles Qualite;${qualitesChoisies.length ? qualitesChoisies.join(", ") : "Aucun"}`,
            `Lot Moule;${document.getElementById("lot-moule").value || "N/A"}`,
            `Lot Pate;${document.getElementById("lot-pate").value || "N/A"}`,
            `Lot Appareil;${document.getElementById("lot-appareil").value || "N/A"}`,
            `Lot Fruit;${document.getElementById("lot-fruit").value || "N/A"}`,
            `Observations;${observationsText || "Aucune"}`,
            "",
            "=== FIN DE PRODUCTION (CONTROLE MATERIEL) ===",
            `Machine controlee;${dataFinProd.ligne}`,
            `Ensemble conforme;${dataFinProd.conforme}`,
            `Visa Controle;${dataFinProd.visa}`,
            "",
            "Identifiant echelle;Poids reel (g);Visa;Nombre de grilles;Heure de fin"
        ];

        document.querySelectorAll(".echelle-card").forEach(carte => {
            const nomEchelle = carte.querySelector(".echelle-type").getAttribute("data-nom-reel");
            const poids = carte.querySelector(".input-poids").value;
            const visa = carte.querySelector(".input-visa").value;
            const grilles = carte.querySelector(".input-grilles").value;
            const heure = carte.querySelector(".input-heure").value;
            
            csvLines.push(`${nomEchelle};${poids};${visa};${grilles};${heure}`);
        });

        const csvString = csvLines.join("\n");
        const blob = new Blob(["\uFEFF" + csvString], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `tracabilite_${nomProduit.replace(/\s+/g, '_')}_${document.getElementById("date-jour").value}.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
</script>
</body>
</html>
